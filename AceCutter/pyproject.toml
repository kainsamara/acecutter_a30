[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acecutter"
version = "0.2.0"
description = "Свой софт для режущего плоттера на GRBL: импорт SVG/DXF → GCode → резка."
requires-python = ">=3.10"
dependencies = [
    "svgelements>=1.9",
    "ezdxf>=1.2",
    "pyserial>=3.5",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.6", "pillow>=10.0"]

[project.scripts]
acecutter = "acecutter.app:main"
acecutter-convert = "acecutter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acecutter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
